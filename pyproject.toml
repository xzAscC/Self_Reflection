[project]
name = "templater-research"
version = "0.1.0"
description = "Template research project for testing and development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apprise>=1.9.3",
    "dotenv>=0.9.9",
    "ipykernel>=6.29.5",
    "loguru>=0.7.3",
    "mlflow>=3.1.0",
    "numpy>=2.3.0",
    "pytest>=8.4.1",
    "torch>=2.7.1",
]
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
